<div
  *ngFor="let post of posts()"
  class="border border-gray-300 rounded-xl p-5 shadow-lg mb-6 bg-white hover:shadow-2xl transition-all"
>
  <!-- Post Header with Avatar -->
  <div class="flex items-center gap-3 mb-3">
    <img
      src="https://avatar.iran.liara.run/public/4"
      class="w-12 h-12 rounded-full border border-gray-300"
      alt="User Avatar"
    />
    <div>
      <h2 class="font-bold text-gray-900 text-lg">{{ post.title }}</h2>
    </div>
  </div>

  <!-- Post Content -->
  <p class="text-gray-700 text-sm leading-relaxed">{{ post.body }}</p>

  <!-- View Comments Button -->
  <button
    class="mt-4 flex items-center gap-2 px-4 py-2 text-blue-600 font-medium rounded-lg bg-blue-100 shadow-md hover:bg-blue-600 hover:text-white transition-all"
    (click)="toggleComments(post.id)"
  >
    <svg
      *ngIf="selectedPostId() !== post.id"
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      class="w-5 h-5"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M19 9l-7 7-7-7"
      />
    </svg>

    <svg
      *ngIf="selectedPostId() === post.id"
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      class="w-5 h-5"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M5 15l7-7 7 7"
      />
    </svg>

    {{ selectedPostId() === post.id ? "Hide Comments" : "View Comments" }}
  </button>

  <!-- Comments Section (Only shown if post is selected) -->
  <app-comment-list
    *ngIf="selectedPostId() === post.id"
    [postId]="post.id"
    class="mt-4"
  ></app-comment-list>
</div>
