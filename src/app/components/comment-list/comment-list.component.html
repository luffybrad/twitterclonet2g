<div
  *ngFor="let comment of comments()"
  class="bg-white shadow-md rounded-lg p-4 mt-3 border border-gray-200"
>
  <!-- Comment Header with Avatar and User Info -->
  <div class="flex flex-col sm:flex-row items-start sm:items-center gap-4">
    <img
      src="https://avatar.iran.liara.run/public/8"
      class="w-12 h-12 sm:w-14 sm:h-14 rounded-full border border-gray-300"
      alt="User Avatar"
    />

    <div class="flex-1">
      <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center">
        <h2 class="font-bold text-blue-500 text-base sm:text-lg">
          {{ comment.name }}
        </h2>
        <span class="text-xs sm:text-sm text-gray-500 mt-1 sm:mt-0">
          {{ comment.email }}
        </span>
      </div>

      <p class="text-gray-700 mt-2 leading-relaxed text-sm sm:text-base">
        {{ comment.body }}
      </p>
    </div>
  </div>
</div>
