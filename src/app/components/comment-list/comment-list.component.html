<div
  *ngFor="let comment of comments()"
  class="bg-blue-200 shadow-md rounded-lg p-4 mt-3 border border-gray-200"
>
  <!-- Comment Header with Avatar and User Info -->
  <div class="flex items-start gap-4">
    <img
      src="https://avatar.iran.liara.run/public/4"
      class="w-12 h-12 rounded-full border border-gray-300"
      alt="User Avatar"
    />

    <div class="flex-1">
      <div class="flex justify-between items-center">
        <h2 class="font-bold text-gray-900 text-lg">{{ comment.name }}</h2>
        <span class="text-sm text-gray-500">{{ comment.email }}</span>
      </div>

      <p class="text-gray-700 mt-2 leading-relaxed">
        {{ comment.body }}
      </p>
    </div>
  </div>
</div>
